<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلوسي">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no">
<title>فلوسي – متابعة الدخل والمصاريف</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14211f;--mut:#6b7b78;--pri:#0f766e;--in:#16a34a;--out:#dc2626;--wr:#d97706;--bd:#e2e8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#17211f;--tx:#e8f0ee;--mut:#8fa3a0;--pri:#2dd4bf;--in:#4ade80;--out:#f87171;--wr:#fbbf24;--bd:#263431}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#17211f;--tx:#e8f0ee;--mut:#8fa3a0;--pri:#2dd4bf;--in:#4ade80;--out:#f87171;--wr:#fbbf24;--bd:#263431}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:17px;margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}.mut{color:var(--mut);font-size:12px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
input,select,button{font:inherit;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:700;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd);width:auto;padding:8px 14px}
button.x{background:none;color:var(--out);width:auto;padding:4px 8px}
.f{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.tag{font-size:11px;background:var(--bd);border-radius:8px;padding:2px 7px;margin-inline-start:6px}
.alert{background:color-mix(in srgb,var(--wr) 15%,transparent);border:1px solid var(--wr);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
.tr{display:flex;align-items:flex-end;gap:10px;height:120px;justify-content:space-around}
.tr div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.tr span{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:96px}.tr span i{width:42%;border-radius:5px 5px 0 0;min-height:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mut);border-radius:10px;padding:8px 2px;font-size:12px}nav button.on{color:var(--pri)}nav b{display:block;font-size:20px}
.hero{background:linear-gradient(135deg,#0f766e,#0891b2);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}.hero small{opacity:.85}.hero .big{font-size:34px;font-weight:800;margin:4px 0}.hero .big span{font-size:14px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{width:auto!important;background:var(--bg)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;padding:8px 12px!important;border-radius:20px!important;font-weight:400!important}.chip.on{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important}
.day{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}.ic{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;margin-inline-end:10px;flex:none}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;min-height:46px}button{touch-action:manipulation}.li>.row:first-child{min-width:0;flex:1}.kpi b{font-size:clamp(14px,4.4vw,18px)}nav button{min-height:52px}
.fab{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px!important;height:56px;border-radius:50%!important;font-size:30px!important;padding:0!important;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:5}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const CATS={'مصاريف':1,'أقساط':1,'جمعيات':1,'ادخار':1,'مرتب':1,'وديعة':1,'دخل آخر':1};
const INC=['دخل','مرتب','وديعة','دخل آخر'],isIn=c=>INC.includes(c);
const ICON={'مرتب':'💼','وديعة':'🏦','دخل آخر':'💵','دخل':'💵','أقساط':'🧾','مصاريف':'🛒','جمعيات':'🤝','ادخار':'🐷'};
const rowH=x=>`<div class="li"><div class="row"><span class="ic">${ICON[x.cat]||'💰'}</span><div>${esc(x.name||x.cat)}<div class="mut">${x.cat}${x.rec?' • ثابت':''}</div></div></div><div class="row"><b class="${isIn(x.cat)?'in':x.cat==='ادخار'?'':'out'}">${isIn(x.cat)?'+':'−'}${fmt(x.amt)}</b>${x.rec?'':`<button class="x" style="color:var(--mut)" onclick="editTx('${x.id}')">✎</button>`}${x.rec?'':`<button class="x" onclick="delTx('${x.id}')">✕</button>`}</div></div>`;
const COL={'مصاريف':'#f59e0b','أقساط':'#ef4444','جمعيات':'#8b5cf6','ادخار':'#16a34a'};
let db={tx:[],rec:[],goal:20},cur,tab='d',editId=null;
try{const s=JSON.parse(localStorage.getItem('mt1'));if(s)db=s}catch(e){}
const save=()=>{try{localStorage.setItem('mt1',JSON.stringify(db))}catch(e){}};
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const idx=m=>{const[a,b]=m.split('-');return a*12+ +b};
const shift=(m,n)=>{const i=idx(m)-1+n;return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0')};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mname=m=>new Date(m+'-15').toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
cur=ym(new Date());
function items(m){
  const t=db.tx.filter(x=>x.m===m).map(x=>({...x,d:(x.d||m+'-01').slice(0,10)}));
  const r=db.rec.filter(x=>idx(m)>=idx(x.start)&&(!+x.n||idx(m)-idx(x.start)<+x.n)).map(x=>({...x,rec:1,t:'out',d:m+'-'+String(Math.min(+x.day||1,28)).padStart(2,'0')}));
  return t.concat(r);
}
function sum(m){
  const s={in:0,'مصاريف':0,'أقساط':0,'جمعيات':0,'ادخار':0};
  items(m).forEach(x=>{if(isIn(x.cat))s.in+=+x.amt;else s[x.cat]+=+x.amt});
  s.exp=s['مصاريف']+s['أقساط']+s['جمعيات'];
  s.left=s.in-s.exp-s['ادخار'];
  return s;
}
function monthNav(){return `<div class="row sp card"><button class="g" onclick="mv(-1)">›</button><b>${mname(cur)}</b><button class="g" onclick="mv(1)">‹</button></div>`}
function mv(n){cur=shift(cur,n);render()}
function dash(){
  const s=sum(cur),now=ym(new Date());
  const goalAmt=s.in*db.goal/100,avail=s.in-s.exp,saved=s['ادخار'];
  const pct=goalAmt?Math.max(0,Math.min(100,(avail/goalAmt)*100)):0;
  const fixed=s['أقساط']+s['جمعيات'],fr=s.in?fixed/s.in*100:0;
  let al='';
  if(s.in===0&&s.exp>0)al='<div class="alert">لسه ما سجلتش دخل الشهر ده. ضيف دخلك من تبويب «إضافة».</div>';
  else if(s.left<0)al='<div class="alert">⚠️ مصاريفك أكتر من دخلك بـ '+fmt(-s.left)+' جنيه.</div>';
  else if(fr>50)al='<div class="alert">⚠️ الأقساط والجمعيات واخدين '+fmt(fr)+'٪ من دخلك، والأفضل تفضل تحت 40–50٪.</div>';
  let daily='';
  if(cur===now){const d=new Date(),left=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;
    daily=`<div class="card row sp"><div><h2>تقدر تصرف النهاردة</h2><span class="mut">من المتبقي ÷ ${left} يوم باقي</span></div><b style="font-size:22px" class="${s.left<0?'out':'in'}">${fmt(Math.max(0,s.left)/left)}</b></div>`}
  const cats=['أقساط','جمعيات','مصاريف','ادخار'],mx=Math.max(1,...cats.map(c=>s[c]));
  const cb=cats.map(c=>`<div style="margin-bottom:10px"><div class="row sp"><span>${c}</span><b>${fmt(s[c])}</b></div><div class="bar"><i style="width:${s[c]/mx*100}%;background:${COL[c]}"></i></div></div>`).join('');
  const ms=[];for(let i=5;i>=0;i--)ms.push(shift(cur,-i));
  const data=ms.map(m=>sum(m)),top=Math.max(1,...data.map(x=>Math.max(x.in,x.exp)));
  const tr=ms.map((m,i)=>`<div><span><i style="height:${data[i].in/top*100}%;background:var(--in)"></i><i style="height:${data[i].exp/top*100}%;background:var(--out)"></i></span>${new Date(m+'-15').toLocaleDateString('ar-EG',{month:'short'})}</div>`).join('');
  return monthNav()+al+hero(s)+upcoming()+`<div class="grid"><div class="kpi"><small>الدخل</small><b class="in">${fmt(s.in)}</b></div><div class="kpi"><small>المصروفات</small><b class="out">${fmt(s.exp)}</b></div><div class="kpi"><small>المتبقي</small><b class="${s.left<0?'out':''}">${fmt(s.left)}</b></div></div><div style="height:12px"></div>`
  +`<div class="card"><div class="row sp"><h2>هدف الادخار (${db.goal}٪ من الدخل)</h2><b>${fmt(goalAmt)}</b></div><div class="bar"><i style="width:${pct}%"></i></div><p class="mut" style="margin:8px 0 0">المتاح للتوفير ${fmt(avail)} • اللي حوشته فعلاً ${fmt(saved)}</p></div>`
  +daily+`<div class="card"><h2>توزيع الشهر</h2>${cb}</div><div class="card"><h2>آخر 6 شهور</h2><div class="tr">${tr}</div><p class="mut" style="margin:8px 0 0"><span class="in">■</span> دخل &nbsp; <span class="out">■</span> مصروفات</p></div>`+recent();
}
function hero(s){
 const it=items(cur),[y,m]=cur.split('-'),N=new Date(y,m,0).getDate(),t=cur===ym(new Date())?new Date().getDate():N;
 const net=Array(N+1).fill(0);it.forEach(x=>net[+x.d.slice(8,10)]+=isIn(x.cat)?+x.amt:-x.amt);
 let c=0;const pts=[];for(let i=1;i<=t;i++){c+=net[i];pts.push(c)}
 const mn=Math.min(0,...pts),mx=Math.max(1,...pts);
 const P=pts.map((v,i)=>(i/Math.max(1,N-1)*300).toFixed(1)+','+(56-(v-mn)/(mx-mn)*52).toFixed(1)).join(' ');
 return `<div class="hero"><small>رصيد الشهر لحد دلوقتي (يوم بيوم)</small><div class="big">${fmt(s.left)} <span>جنيه</span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:60px"><polyline points="${P}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg></div>`;
}
function recent(){
 const rc=items(cur).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,4).map(rowH).join('');
 return `<div class="card"><div class="row sp"><h2>آخر الحركات</h2><button class="g" onclick="tab='a';render()">السجل اليومي</button></div>${rc||'<p class="mut">ابدأ بتسجيل أول حركة.</p>'}</div>`;
}
function tl(){
 const it=items(cur).sort((a,b)=>a.d.localeCompare(b.d)||(isIn(b.cat)-isIn(a.cat)));
 let bal=0;const g={};
 it.forEach(x=>{bal+=isIn(x.cat)?+x.amt:-x.amt;x.bal=bal;(g[x.d]=g[x.d]||[]).push(x)});
 return Object.keys(g).sort().reverse().map(d=>{const net=g[d].reduce((t,x)=>t+(isIn(x.cat)?+x.amt:-x.amt),0);
  return `<div class="day"><div class="row sp"><b>${new Date(d+'T12:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'short'})}</b><span class="mut"><span class="${net<0?'out':'in'}">${net<0?'−':'+'}${fmt(Math.abs(net))}</span> • الرصيد ${fmt(g[d][g[d].length-1].bal)}</span></div>${g[d].map(rowH).join('')}</div>`}).join('')||'<div class="card mut">مفيش حركات الشهر ده.</div>';
}
function editTx(id){editId=id;tab='a';render();scrollTo(0,0)}
function upcoming(){
 if(cur!==ym(new Date()))return '';
 const t=new Date().getDate(),u=items(cur).filter(x=>x.rec&&x.cat!=='مصاريف'&&+x.d.slice(8)>=t&&+x.d.slice(8)<=t+7).sort((a,b)=>a.d.localeCompare(b.d));
 if(!u.length)return '';
 return `<div class="alert"><b>🔔 مستحقات الأسبوع الجاي</b>${u.map(x=>{const dd=+x.d.slice(8)-t;return `<div class="row sp" style="margin-top:6px"><span>${esc(x.name||x.cat)}</span><span>${fmt(x.amt)} • ${dd?'بعد '+dd+' يوم':'النهاردة'}</span></div>`}).join('')}</div>`;
}
function pick(b){document.getElementById('c').value=b.dataset.v;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))}
function add(){
 const E=db.tx.find(x=>x.id===editId),cc=E?E.cat:'مصاريف',td=new Date().toISOString().slice(0,10),dv=E?E.d.slice(0,10):ym(new Date())===cur?td:cur+'-01';
 return monthNav()+`<div class="card"><h2>${E?'تعديل حركة':'تسجيل حركة'}</h2><div class="f"><div class="chips">${Object.keys(CATS).map((c,i)=>`<button class="chip${c===cc?' on':''}" data-v="${c}" onclick="pick(this)">${ICON[c]} ${c}</button>`).join('')}</div><input type="hidden" id="c" value="${cc}"><input id="dt" type="date" value="${dv}"><input id="n" value="${E?esc(E.name||''):''}" placeholder="الوصف (مرتب الشركة، قسط، وديعة...)"><input id="a" value="${E?E.amt:''}" type="number" inputmode="decimal" placeholder="المبلغ"><button onclick="addTx()">${E?'حفظ التعديل':'حفظ'}</button>${E?'<button class="g" style="width:100%" onclick="editId=null;render()">إلغاء</button>':''}</div></div><h2 style="margin:4px 4px 8px">السجل اليومي</h2>${tl()}`;
}
function addOld(){
  const list=items(cur).sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(x=>`<div class="li"><div>${esc(x.name||x.cat)}<span class="tag">${x.cat}</span>${x.rec?'<span class="tag">ثابت</span>':''}</div><div class="row"><b class="${x.cat==='دخل'?'in':x.cat==='ادخار'?'':'out'}">${x.cat==='دخل'?'+':'−'}${fmt(x.amt)}</b>${x.rec?'':`<button class="x" onclick="delTx('${x.id}')">✕</button>`}</div></div>`).join('')||'<p class="mut">مفيش حاجة متسجلة الشهر ده.</p>';
  return monthNav()+`<div class="card"><h2>إضافة حركة</h2><div class="f"><select id="c">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select><input id="n" placeholder="الوصف (مثلاً: مرتب، كهربا، قسط موبايل)"><input id="a" type="number" inputmode="decimal" placeholder="المبلغ"><button onclick="addTx()">حفظ</button></div></div><div class="card"><h2>حركات الشهر</h2>${list}</div>`;
}
function addTx(){
  const a=+$v('a');if(!a||a<=0)return alert('اكتب المبلغ');
  const dt=$v('dt');if(!dt)return alert('اختار التاريخ');const o={m:dt.slice(0,7),cat:$v('c'),name:$v('n'),amt:a,d:dt},E=db.tx.find(x=>x.id===editId);if(E)Object.assign(E,o);else db.tx.push({id:Date.now()+'',...o});editId=null;save();cur=dt.slice(0,7);render();
}
const $v=id=>document.getElementById(id).value;
function delTx(id){db.tx=db.tx.filter(x=>x.id!==id);save();render()}
function recs(){
  const l=db.rec.map(x=>{const used=idx(cur)-idx(x.start)+1,rem=+x.n?Math.max(0,+x.n-Math.max(0,used)+0):0;
    return `<div class="li"><div>${esc(x.name)}<span class="tag">${x.cat}</span><div class="mut">من ${mname(x.start)} • ${+x.n?x.n+' شهر':'مستمر'}${+x.n?' • باقي '+Math.max(0,+x.n-(idx(ym(new Date()))-idx(x.start)+1))+' شهر':''}</div></div><div class="row"><b class="out">${fmt(x.amt)}</b><button class="x" onclick="delRec('${x.id}')">✕</button></div></div>`}).join('')||'<p class="mut">لسه مضفتش التزامات.</p>';
  const tot=db.rec.filter(x=>idx(ym(new Date()))>=idx(x.start)&&(!+x.n||idx(ym(new Date()))-idx(x.start)<+x.n)).reduce((t,x)=>t+ +x.amt,0);
  return `<div class="card"><h2>التزام شهري ثابت (قسط / جمعية)</h2><p class="mut" style="margin-top:0">بيتحسب تلقائي كل شهر، ومش لازم تدخله كل مرة.</p><div class="f"><select id="rc"><option>أقساط</option><option>جمعيات</option><option>مصاريف</option></select><input id="rn" placeholder="الاسم (قسط عربية، جمعية أم محمد)"><input id="ra" type="number" inputmode="decimal" placeholder="المبلغ الشهري"><div class="row"><div style="flex:1"><span class="mut">بداية من</span><input id="rs" type="month" value="${ym(new Date())}"></div><div style="flex:1"><span class="mut">عدد الشهور (0 = مستمر)</span><input id="rm" type="number" inputmode="numeric" value="12"></div></div><div><span class="mut">يوم الاستحقاق من الشهر (1–28)</span><input id="rd" type="number" inputmode="numeric" value="1" min="1" max="28"></div><button onclick="addRec()">حفظ الالتزام</button></div></div><div class="card"><div class="row sp"><h2>الالتزامات الحالية</h2><b class="out">${fmt(tot)} / شهر</b></div>${l}</div>`;
}
function addRec(){
  const a=+$v('ra');if(!a||!$v('rs'))return alert('اكمل البيانات');
  db.rec.push({id:Date.now()+'',cat:$v('rc'),name:$v('rn'),amt:a,start:$v('rs'),n:+$v('rm')||0,day:+$v('rd')||1});save();render();
}
function delRec(id){db.rec=db.rec.filter(x=>x.id!==id);save();render()}
function sett(){
  return `<div class="card"><h2>هدف الادخار الشهري</h2><div class="row"><input id="g" type="number" inputmode="numeric" value="${db.goal}"><span>٪ من الدخل</span></div><div style="height:8px"></div><button onclick="db.goal=+$v('g')||0;save();alert('تم الحفظ');render()">حفظ</button></div>
  <div class="card"><h2>نسخة احتياطية</h2><p class="mut" style="margin-top:0">البيانات محفوظة على جهازك بس. خد نسخة بشكل دوري عشان لو مسحت بيانات المتصفح.</p><div class="f"><button onclick="exp()">تصدير نسخة</button><textarea id="im" rows="3" placeholder="الصق النسخة هنا للاسترجاع" style="font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></textarea><button class="g" style="width:100%" onclick="imp()">استرجاع</button></div></div>
  <div class="card"><h2>تثبيته على الآيفون</h2><p class="mut" style="margin:0">افتح الرابط في Safari، دوس على زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية». هيشتغل زي أي تطبيق.</p></div>
  <button class="g" style="width:100%;color:var(--out)" onclick="if(confirm('مسح كل البيانات؟')){db={tx:[],rec:[],goal:20};save();render()}">مسح كل البيانات</button>`;
}
function exp(){const j=JSON.stringify(db);navigator.clipboard?.writeText(j).then(()=>alert('اتنسخت. الصقها في الملاحظات واحتفظ بيها.'),()=>prompt('انسخ النسخة:',j))||prompt('انسخ النسخة:',j)}
